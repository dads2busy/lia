[project]
name = "lia"
version = "0.1.0"
description = "Lia is a local intelligence assistant"
authors = [
    {name="Dustin Machi", email="dm8qs@virginia.edu"}
]
requires-python = ">=3.10"
dependencies=[
    "typer>=0.9.1",
    "pydantic>2.0.0",
    "pydantic_ai==0.2.12",
    "pydantic_ai[mcp]==0.2.12",
    "prompt_toolkit",
    "hnswlib",
    "mcp==1.9.0",
    "fastmcp>=2.5.2",
    "fastapi",
    "networkx>=3.4.2",
    "scipy>=1.15.3",
    "numpy>=1.23.5",
    "pandas>=2.2.3",
    "jinja2",
    "uvenv",
    "wikipedia-mcp",
    "sentence-transformers>=4.1.0",
    "duckduckgo-mcp-server>=0.1.1",
    "mcp-simple-arxiv>=0.2.2",
    "duckdb>=1.2.2",
    "pyarrow>=20.0.0"
]

[project.scripts]
lia = "lia.cli:app"

