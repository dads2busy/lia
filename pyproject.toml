[project]
name = "lia"
version = "0.1.0"
description = "Lia is a local intelligence assistant"
authors = [
    {name="Dustin Machi", email="dm8qs@virginia.edu"}
]
requires-python = "==3.11.11"
dependencies=[
    "typer==0.15.3",
    "click==8.1.7",
    "pydantic==2.10.6",
    "pydantic_ai==0.3.4",
    "prompt_toolkit",
    "hnswlib",
    "mcp>=1.9.4",
    "fastmcp>=2.9.2",
    "fastapi",
    "networkx>=3.4.2",
    "scipy>=1.15.3",
    "numpy>=1.23.5",
    "pandas>=2.2.3",
    "jinja2",
    "uvenv",
    "wikipedia-mcp>=1.6.0",
    "sentence-transformers>=4.1.0",
    "torch>=1.11.0",
    "duckduckgo-mcp-server>=0.1.1",
    "mcp-simple-arxiv>=0.2.2",
    "duckdb>=1.2.2",
    "pyarrow>=20.0.0",
    "faiss-cpu",
    "pdfminer.six[image]",
    "huggingface_hub",
    "supervisor",
    "crawl4ai",
    "mcp-google-cse",
    "mcp-server-fetch"
]

[project.scripts]
lia = "lia.cli:app"

